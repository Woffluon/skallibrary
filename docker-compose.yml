services:
  web:
    build: .
    image: ghcr.io/cotanjant/skallibrary:latest
    container_name: skal_library
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_DB_PATH=/app/data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
